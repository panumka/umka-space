<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'UmkA.space' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='3') }}">
  <!-- Favicons -->
  <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon/favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ url_for('static', filename='favicon/favicon-16.png') }}" sizes="16x16" type="image/png">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
  <meta name="theme-color" content="#111111">
  <script defer src="{{ url_for('static', filename='script.js', v='3') }}"></script>
  <style>
    .logo-main {
      font-size: 22px;
    }
    .logo-sub {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <!-- Лого потім; зараз просто назва згідно з вимогою: U та A великі -->
        <a href="{{ url_for('index') }}" class="logo">
          <span class="logo-main">UmkA</span>
          <span class="logo-sub" style="display:block; line-height:1;">music</span>
        </a>
      </div>
      <nav class="main-nav" aria-label="Головна навігація">
        <a href="/panamabattle" class="nav-link {% if active == 'panamabattle' %}active{% endif %}" {% if active == 'panamabattle' %}aria-current="page"{% endif %}>
          <span class="nav-top">UmkA</span><br>
          <span class="nav-bottom">PANAMABATTLE</span>
        </a>
        <a href="/blog" class="nav-link {% if active == 'blog' %}active{% endif %}" {% if active == 'blog' %}aria-current="page"{% endif %}>
          <span class="nav-top">UmkA</span><br>
          <span class="nav-bottom">каже</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© UmkA, {{ current_year }}</small>
    </div>
  </footer>
</body>
</html>
